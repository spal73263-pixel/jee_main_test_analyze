version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: jee_postgres_db
    restart: always
    environment:
      POSTGRES_USER: jee_user
      POSTGRES_PASSWORD: jee_password
      POSTGRES_DB: jee_analyzer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jee_user -d jee_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jee_analyzer_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://jee_user:jee_password@db:5432/jee_analyzer
      JWT_SECRET: production_secret_key_change_me_in_prod_998877665544332211
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 10080
      PORT: 8000

volumes:
  postgres_data:
