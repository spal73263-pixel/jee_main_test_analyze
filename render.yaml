services:
  - type: web
    name: jee-main-analyzer
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: DATABASE_URL
        fromDatabase:
          name: jee-main-db
          property: connectionString

databases:
  - name: jee-main-db
    plan: free
    region: singapore
    databaseName: jee_analyzer
    user: jee_user
